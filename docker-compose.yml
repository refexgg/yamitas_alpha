services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY in Coolify}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yamitas}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in Coolify}@db:5432/${POSTGRES_DB:-yamitas}
      UPLOAD_FOLDER: /app/static/uploads
      SESSION_COOKIE_SECURE: "true"
      REMEMBER_COOKIE_SECURE: "true"
      PORT: "8000"
    expose:
      - "8000"
    volumes:
      - uploads:/app/static/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://app:8000

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yamitas}
      POSTGRES_USER: ${POSTGRES_USER:-yamitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads:
